OR PRO</div><div class="badge">ONLINE</div></div><div class="sel"><select id="from"><option value="id">ID</option><option value="en" selected>EN</option><option value="ja">JP</option><option value="ko">KO</option><option value="ar">AR</option><option value="zh">CN</option></select><button id="swap">⇄</button><select id="to"><option value="id" selected>ID</option><option value="en">EN</option><option value="ja">JP</option><option value="ko">KO</option><option value="ar">AR</option><option value="zh">CN</option></select></div><div class="chat" id="chat"><div class="bubble ai">Halo! Ketik teks apapun.</div></div><div class="input"><textarea id="inp" placeholder="Ketik teks..." rows="1"></textarea><button class="send" id="send">↑</button></div></div><script>const chat=document.getElementById('chat'),inp=document.getElementById('inp'),from=document.getElementById('from'),to=document.getElementById('to');document.getElementById('swap').onclick=()=>{let a=from.value;from.value=to.value;to.value=a};function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});async function go(){let txt=inp.value.trim();if(!txt)return;add(txt,'user');inp.value='';inp.style.height='auto';let load=add('Translating...','ai');try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair='+from.value+'|'+to.value);let j=await r.json();load.remove();let hasil=j.responseData.translatedText;add(from.value.toUpperCase()+' → '+to.value.toUpperCase()+'<div class=out>'+hasil+'</div><div style=margin-top:8px><button onclick=navigator.clipboard.writeText(this.dataset.t) data-t='+hasil.replace(/"/g,'&quot;')+' style=background:#06100a;border:1px solid #143d1f;color:#22c55e;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:700>COPY</button></div>','ai');}catch(e){load.remove();add('Gagal: '+e.message,'ai')}}document.getElementById('send').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});<\/script></body></html>`

{

<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#000;font-family:'Inter',sans-serif;color:#fff}
.app{max-width:540px;width:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:12px}

@keyframes pulse{0%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}100%{opacity:.4;transform:scale(.9)}}

<body>
<div class="app">
<div class="header"><div class="header-left"><div class="logo-box"><svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg></div><div class="brand"><h1>RIFNAL AI</h1><div class="sub">Direct Player Pro</div></div></div><div class="status-badge checking" id="statusBadge"><span class="dot"></span><span id="statusText">CHECKING</span></div></div>
<div class="chat-area" id="chatArea"><div class="bubble ai"><div class="ai-label">RIFNAL AI</div>Kirim tautan video TikTok, saya akan mengambil video asli tanpa watermark.</div></div>
<div class="detector neutral" id="detectorBar"><span id="detectorText">Menunggu link...</span></div>
<div class="input-area"><input id="urlInput" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off"><button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></div>
</div>
<script>
(function(){
const statusBadge=document.getElementById('statusBadge'),statusText=document.getElementById('statusText'),chatArea=document.getElementById('chatArea'),urlInput=document.getElementById('urlInput'),sendBtn=document.getElementById('sendBtn'),detectorBar=document.getElementById('detectorBar'),detectorText=document.getElementById('detectorText');
function setStatus(t,l){statusBadge.className='status-badge '+t;statusText.textContent=l}
async function checkStatus(){
  if(!navigator.onLine){setStatus('nointernet','NO INTERNET');return}
  setStatus('checking','CHECKING');
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),3500);
    await fetch('https://www.gstatic.com/generate_204',{signal:c.signal,cache:'no-store',mode:'no-cors'});
    setStatus('online','ONLINE');
  }catch{setStatus('nointernet','NO INTERNET')}
}
checkStatus();setInterval(checkStatus,10000);
window.addEventListener('online',checkStatus);
window.addEventListener('offline',()=>setStatus('nointernet','NO INTERNET'));
function updateDetector(){let v=urlInput.value.trim();if(!v){detectorBar.className='detector neutral';detectorText.textContent='Menunggu link...';return}if(/(tiktok\\.com|vt\\.tiktok\\.com|vm\\.tiktok\\.com)/i.test(v)){detectorBar.className='detector valid';detectorText.textContent='Link valid - siap putar'}else{detectorBar.className='detector invalid';detectorText.textContent='Link tidak valid (bukan TikTok)'}}
urlInput.addEventListener('input',updateDetector);
urlInput.addEventListener('paste',()=>setTimeout(updateDetector,50));
updateDetector();
function pauseAll(vs,ex){document.querySelectorAll('video').forEach(v=>{if(v!==ex&&!v.paused)v.pause()})}
function addUserMessage(t){let d=document.createElement('div');d.className='bubble user';d.textContent=t;chatArea.appendChild(d);chatArea.scrollTop=chatArea.scrollHeight}
function addAiMessage(h){let d=document.createElement('div');d.className='bubble ai';d.innerHTML='<div class="ai-label">RIFNAL AI</div>'+h;chatArea.appendChild(d);chatArea.scrollTop=chatArea.scrollHeight;return d}
function addAiError(m){addAiMessage('<span class="error-text">'+m+'</span>')}
function buildCard(d){let esc=(d.title||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');return '<div class="video-wrap"><video controls playsinline poster="'+(d.cover||'')+'" src="'+(d.play||d.hdplay||'')+'"></video></div><div class="video-bar"><span>DIRECT VIDEO</span><span class="right">NO WATERMARK</span></div><div class="caption-box">'+esc+'</div>'}
async function processUrl(url){if(!navigator.onLine){addAiError('Tidak ada internet');return}let load=addAiMessage('<span class="spinner"></span> Mengambil video...');try{let r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(url));let j=await r.json();if(j.code!==0||!j.data)throw new Error(j.msg||'Gagal');load.remove();let m=addAiMessage(buildCard(j.data));let v=m.querySelector('video');if(v)v.addEventListener('play',function(){pauseAll(document.querySelectorAll('video'),this)})}catch(e){load.remove();addAiError('Gagal: '+(e.message||'Coba lagi'));setStatus('offline','API OFFLINE')}}
async function handleSend(){let url=urlInput.value.trim();if(!url){addAiMessage('<span class="warn-text">Masukkan link dulu ya</span>');return}if(!/(tiktok\\.com|vt\\.tiktok\\.com|vm\\.tiktok\\.com)/i.test(url)){addAiError('Link tidak valid');urlInput.value='';updateDetector();return}addUserMessage(url);urlInput.value='';updateDetector();sendBtn.disabled=true;await processUrl(url);sendBtn.disabled=false}
sendBtn.onclick=handleSend;urlInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleSend()}});
})();
<\/script>
</body>
</html>`
  }
];

const list=document.getElementById('list'), menuPage=document.getElementById('menuPage'), playerPage=document.getElementById('playerPage'), frame=document.getElementById('frame'), loader=document.getElementById('loader');

function render(){
  list.innerHTML='';
  if(menus.length===0){
    list.innerHTML='<div class="btn" style="justify-content:center;color:#333;border-style:dashed;animation-delay:.5s">Belum ada tools - isi const menus</div>';
    return;
  }
  menus.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='btn'; b.style.animationDelay=(0.5+i*0.1)+'s';
    b.innerHTML=m.name+' <span>'+m.tag+'</span>';
    b.onclick=()=>openPlayer(i);
    list.appendChild(b);
  });
}
render();

function openPlayer(i){
  menuPage.classList.add('exit');
  playerPage.classList.add('active');
  document.getElementById('pTitle').innerText=menus[i].name;
  frame.classList.remove('loaded'); loader.style.display='flex';
  const blob=new Blob([menus[i].html],{type:'text/html'});
  frame.src=URL.createObjectURL(blob);
  frame.onload=()=>{ setTimeout(()=>{loader.style.display='none'; frame.classList.add('loaded');},400); };
}
function closePlayer(){
  menuPage.classList.remove('exit'); playerPage.classList.remove('active');
  frame.classList.remove('loaded'); setTimeout(()=>{frame.src='';},400);
}
</script>
